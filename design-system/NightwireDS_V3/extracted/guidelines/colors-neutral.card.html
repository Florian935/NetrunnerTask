<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & Text" subtitle="Steel → frost text ramp on void" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);padding:18px;display:flex;gap:12px}
.sw{flex:1;height:112px;border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:space-between;padding:10px;background:var(--void-600)}
.sw .big{font-family:var(--font-display);font-size:22px}
.sw b{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.sw code{font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}</style></head>
<body>
<div class="sw"><span class="big" style="color:var(--frost-100)">Frost</span><div><b>text-primary</b><br><code>#E6F1FF</code></div></div>
<div class="sw"><span class="big" style="color:var(--steel-200)">Steel 200</span><div><b>text-label</b><br><code>#B9C6DC</code></div></div>
<div class="sw"><span class="big" style="color:var(--steel-400)">Steel 400</span><div><b>text-secondary</b><br><code>#8B9BB4</code></div></div>
<div class="sw"><span class="big" style="color:var(--steel-600)">Steel 600</span><div><b>text-muted</b><br><code>#566079</code></div></div>
</body></html>
