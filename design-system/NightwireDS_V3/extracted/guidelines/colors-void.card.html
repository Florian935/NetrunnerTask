<!-- @dsCard group="Colors" viewport="700x150" name="Void & Surfaces" subtitle="Dark background ramp (blue-tinted, never pure black)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);padding:18px;display:flex;gap:8px}
.sw{flex:1;height:112px;border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.sw b{font-family:var(--font-mono);font-size:11px;color:var(--frost-100)}
.sw code{font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}</style></head>
<body>
<div class="sw" style="background:var(--void-900)"><b>900</b><code>#05060A</code></div>
<div class="sw" style="background:var(--void-800)"><b>800</b><code>#080B12</code></div>
<div class="sw" style="background:var(--void-700)"><b>700 app</b><code>#0A0E17</code></div>
<div class="sw" style="background:var(--void-600)"><b>600 panel</b><code>#10151F</code></div>
<div class="sw" style="background:var(--void-500)"><b>500 surface</b><code>#161C2B</code></div>
<div class="sw" style="background:var(--void-400)"><b>400 hover</b><code>#1D2436</code></div>
<div class="sw" style="background:var(--void-300)"><b>300 border</b><code>#28324A</code></div>
<div class="sw" style="background:var(--void-200)"><b>200 divide</b><code>#3A465F</code></div>
</body></html>
