<!-- @dsCard group="Spacing" viewport="700x160" name="Radii & Bevels" subtitle="Tiny radii; roundness comes from chamfers" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);padding:20px;display:flex;gap:18px;align-items:center}
.box{width:100px;height:92px;background:var(--void-500);border:1px solid var(--cyan-600);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.box b{font-family:var(--font-mono);font-size:11px;color:var(--cyan-400)}
.box code{font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}</style></head>
<body>
<div class="box" style="border-radius:2px"><b>xs</b><code>2px</code></div>
<div class="box" style="border-radius:4px"><b>md</b><code>4px default</code></div>
<div class="box" style="border-radius:999px;width:92px"><b>pill</b><code>badges</code></div>
<div class="box" style="clip-path:var(--clip-bevel-sm);border:none;box-shadow:inset 0 0 0 1px var(--cyan-500)"><b>bevel-sm</b><code>6px chamfer</code></div>
<div class="box" style="clip-path:var(--clip-bevel-md);border:none;box-shadow:inset 0 0 0 1px var(--cyan-500)"><b>bevel-md</b><code>10px chamfer</code></div>
</body></html>
