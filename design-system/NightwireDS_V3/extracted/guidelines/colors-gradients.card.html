<!-- @dsCard group="Colors" viewport="700x150" name="Gradients" subtitle="The four brand gradients" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);padding:18px;display:flex;gap:12px}
.sw{flex:1;height:112px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.sw b{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.sw code{font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,.8)}</style></head>
<body>
<div class="sw" style="background:var(--grad-primary)"><b>Primary</b><code>violet → magenta</code></div>
<div class="sw" style="background:var(--grad-cyber)"><b>Cyber</b><code>cyan → violet</code></div>
<div class="sw" style="background:var(--grad-heat)"><b>Heat</b><code>magenta → amber</code></div>
<div class="sw" style="background:var(--grad-mint)"><b>Mint</b><code>mint → cyan</code></div>
</body></html>
