<!-- @dsCard group="Colors" viewport="700x150" name="Neon Accents" subtitle="The four signature neons + violet" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);padding:18px;display:flex;gap:12px}
.sw{flex:1;height:112px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;position:relative;overflow:hidden}
.sw b{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;color:var(--void-900)}
.sw code{font-family:var(--font-mono);font-size:10px;color:rgba(5,6,10,.7)}
.glow{position:absolute;inset:0;box-shadow:inset 0 0 30px rgba(255,255,255,.25)}</style></head>
<body>
<div class="sw" style="background:var(--cyan-500)"><div class="glow"></div><b>Cyan · Primary</b><code>#00F0FF</code></div>
<div class="sw" style="background:var(--magenta-500)"><div class="glow"></div><b>Magenta · Secondary</b><code>#FF2D95</code></div>
<div class="sw" style="background:var(--mint-500)"><div class="glow"></div><b>Mint · Tertiary</b><code>#2EFFC2</code></div>
<div class="sw" style="background:var(--lime-500)"><div class="glow"></div><b>Lime</b><code>#B6FF3B</code></div>
<div class="sw" style="background:var(--violet-500)"><b style="color:#fff">Violet</b><code style="color:rgba(255,255,255,.75)">#A855F7</code></div>
</body></html>
