<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--void-900);padding:26px;display:flex;gap:26px;align-items:center;justify-content:center}
.dot{width:110px;height:70px;border-radius:var(--radius-md);background:var(--void-600);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--frost-100)}</style></head>
<body>
<div class="dot" style="box-shadow:var(--glow-cyan)">cyan</div>
<div class="dot" style="box-shadow:var(--glow-magenta)">magenta</div>
<div class="dot" style="box-shadow:var(--glow-mint)">mint</div>
<div class="dot" style="box-shadow:var(--glow-violet)">violet</div>
<div class="dot" style="box-shadow:var(--glow-danger)">danger</div>
</body></html>
