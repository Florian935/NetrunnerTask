<!-- @dsCard group="Brand" viewport="700x220" name="Terminal Frame" subtitle="Hairline neon outline + corner ticks + circuit edge" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--void-900);padding:24px}
.frame{position:relative;background:var(--bg-inset);border:1px solid rgba(255,45,149,.4);box-shadow:inset 0 0 24px -14px var(--magenta-500);max-width:620px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid rgba(255,45,149,.4)}
.hatch{width:16px;height:8px;background:var(--hatch-magenta)}
.title{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--magenta-500)}
.status{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.body{padding:16px;font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--text-secondary)}
.body .c{color:var(--cyan-400)}.body .m{color:var(--mint-500)}
.tick{position:absolute;width:9px;height:9px;border:0 solid var(--magenta-500)}
.tl{top:-1px;left:-1px;border-width:2px 0 0 2px}.tr{top:-1px;right:-1px;border-width:2px 2px 0 0}
.bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px}.br{bottom:-1px;right:-1px;border-width:0 2px 2px 0}</style></head>
<body>
<div class="frame">
  <div class="bar"><span class="hatch"></span><span class="title">Data Stream</span><span class="status">0x4F · ++++</span></div>
  <div class="body"><span class="c">&gt;</span> routing through cold node… <span class="m">OK</span><br><span class="c">&gt;</span> inject sigma keys · trace decays in <span style="color:var(--magenta-400)">94</span> cycles<br><span class="c">&gt;</span> hold firebridge · <span class="m">██▒▒</span> 62%</div>
  <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
</div>
</body></html>
