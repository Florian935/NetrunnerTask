<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base unit · space-1 → space-16" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);padding:20px;display:flex;align-items:flex-end;gap:18px}
.u{display:flex;flex-direction:column;align-items:center;gap:8px}
.bar{background:var(--grad-cyber);border-radius:2px}
.u b{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)}
.u code{font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}</style></head>
<body>
<div class="u"><div class="bar" style="width:4px;height:4px"></div><b>1</b><code>4</code></div>
<div class="u"><div class="bar" style="width:8px;height:8px"></div><b>2</b><code>8</code></div>
<div class="u"><div class="bar" style="width:12px;height:12px"></div><b>3</b><code>12</code></div>
<div class="u"><div class="bar" style="width:16px;height:16px"></div><b>4</b><code>16</code></div>
<div class="u"><div class="bar" style="width:24px;height:24px"></div><b>6</b><code>24</code></div>
<div class="u"><div class="bar" style="width:32px;height:32px"></div><b>8</b><code>32</code></div>
<div class="u"><div class="bar" style="width:48px;height:48px"></div><b>12</b><code>48</code></div>
<div class="u"><div class="bar" style="width:64px;height:64px"></div><b>16</b><code>64</code></div>
</body></html>
