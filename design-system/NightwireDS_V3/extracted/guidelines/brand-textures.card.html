<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--void-900);padding:18px;display:flex;gap:14px}
.t{flex:1;height:112px;position:relative;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--void-700)}
.t span{position:absolute;bottom:8px;left:8px;font-family:var(--font-mono);font-size:10px;color:var(--frost-100);z-index:2}
.grid{background-image:var(--grid-lines);background-size:var(--grid-size)}
.scan::after{content:"";position:absolute;inset:0;background:var(--scanlines)}
.hatch{background-image:var(--hatch-cyan);background-size:auto}</style></head>
<body>
<div class="t grid"><span>Grid backdrop</span></div>
<div class="t scan" style="background:var(--void-500)"><span>Scanlines</span></div>
<div class="t"><div style="position:absolute;inset:0;opacity:.9;background:var(--hatch-cyan)"></div><span>Hatch · ///</span></div>
</body></html>
