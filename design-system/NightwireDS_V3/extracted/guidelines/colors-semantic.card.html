<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Status" subtitle="success · warning · danger · info" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);padding:18px;display:flex;gap:12px}
.sw{flex:1;height:112px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.sw b{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;color:var(--void-900)}
.sw code{font-family:var(--font-mono);font-size:10px;color:rgba(5,6,10,.7)}</style></head>
<body>
<div class="sw" style="background:var(--success)"><b>Success</b><code>--success · mint</code></div>
<div class="sw" style="background:var(--warning)"><b>Warning</b><code>--warning · amber</code></div>
<div class="sw" style="background:var(--danger)"><b style="color:#fff">Danger</b><code style="color:rgba(255,255,255,.75)">--danger · red</code></div>
<div class="sw" style="background:var(--info)"><b>Info</b><code>--info · cyan</code></div>
</body></html>
