<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-app);padding:22px}#root{max-width:660px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);width:100%;margin-bottom:-6px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Select, Checkbox, Radio, Switch, Slider } = window.NightwireDesignSystem_f7f010;
function Demo(){
  const [sl,setSl]=React.useState(60);
  const [sw,setSw]=React.useState(true);
  const [cb,setCb]=React.useState(true);
  const [rb,setRb]=React.useState('a');
  return <div>
    <div className="lbl">Buttons</div>
    <div className="row">
      <Button variant="primary">Deploy</Button>
      <Button variant="secondary">Scan</Button>
      <Button variant="ghost">Cancel</Button>
      <Button variant="danger">Purge</Button>
      <Button variant="secondary" hud leftIcon={<i data-lucide="zap"></i>}>HUD</Button>
      <Button variant="primary" disabled>Locked</Button>
    </div>
    <div className="lbl">Icon buttons</div>
    <div className="row">
      <IconButton name="settings" variant="solid"/>
      <IconButton name="bell" variant="outline"/>
      <IconButton name="search" variant="ghost"/>
      <IconButton name="power" variant="solid" hud/>
    </div>
    <div className="lbl">Inputs & select</div>
    <div className="row">
      <Input placeholder="Search the grid…" icon="search" style={{width:220}}/>
      <Input placeholder="Access code" error style={{width:150}}/>
      <Select options={['Watson','Pacifica','Westbrook']} value="Watson" onChange={()=>{}} />
    </div>
    <div className="lbl">Controls</div>
    <div className="row">
      <Checkbox checked={cb} onChange={setCb} label="Auto-jack"/>
      <Radio name="m" value="a" checked={rb==='a'} onChange={setRb} label="Stealth"/>
      <Radio name="m" value="b" checked={rb==='b'} onChange={setRb} label="Brute"/>
      <Switch checked={sw} onChange={setSw} label="ICE"/>
    </div>
    <div className="row"><Slider value={sl} onChange={setSl} showValue accent="var(--magenta-500)" style={{width:260}}/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
setTimeout(()=>window.lucide&&window.lucide.createIcons(),100);
</script>
</body>
</html>
